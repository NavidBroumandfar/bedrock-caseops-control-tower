<svg width="1200" height="650" viewBox="0 0 1200 650" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Bedrock CaseOps Control Tower architecture flow</title>
  <desc id="desc">A custom Python orchestration pipeline that sends documents through intake, Bedrock Knowledge Base retrieval, analysis, validation, safety gates, and structured output.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1200" y2="650" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#111827"/>
      <stop offset="1" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="aws" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb74d"/>
      <stop offset="1" stop-color="#ff9900"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/>
    </marker>
    <style>
      .title { font: 700 34px Helvetica, Arial, sans-serif; fill: #f8fafc; }
      .subtitle { font: 400 16px Helvetica, Arial, sans-serif; fill: #cbd5e1; }
      .lane { font: 700 12px Helvetica, Arial, sans-serif; fill: #94a3b8; letter-spacing: 1.5px; }
      .node-title { font: 700 17px Helvetica, Arial, sans-serif; fill: #f8fafc; }
      .node-body { font: 400 13px Helvetica, Arial, sans-serif; fill: #cbd5e1; }
      .small { font: 700 12px Helvetica, Arial, sans-serif; fill: #0f172a; }
      .pill { font: 700 12px Helvetica, Arial, sans-serif; fill: #dbeafe; }
      .caption { font: 400 13px Helvetica, Arial, sans-serif; fill: #94a3b8; }
      .line { stroke: #94a3b8; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .muted-line { stroke: #475569; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <rect width="1200" height="650" fill="url(#canvas)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#aws)"/>

  <text x="600" y="58" text-anchor="middle" class="title">Bedrock CaseOps Control Tower</text>
  <text x="600" y="86" text-anchor="middle" class="subtitle">Custom Python multi-agent RAG for grounded review, validation, and structured escalation</text>

  <text x="78" y="139" class="lane">ENTRYPOINTS</text>
  <text x="361" y="139" class="lane">CUSTOM ORCHESTRATION</text>
  <text x="815" y="139" class="lane">BEDROCK SERVICES</text>
  <text x="934" y="455" class="lane">OUTPUTS</text>

  <g filter="url(#shadow)">
    <rect x="58" y="166" width="200" height="116" rx="8" fill="#111827" stroke="#334155"/>
    <text x="86" y="202" class="node-title">CLI / Lambda</text>
    <text x="86" y="229" class="node-body">Document path or event</text>
    <text x="86" y="251" class="node-body">Metadata validation</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="316" y="166" width="220" height="116" rx="8" fill="#111827" stroke="#334155"/>
    <text x="344" y="202" class="node-title">Document Intake</text>
    <text x="344" y="229" class="node-body">Normalize request</text>
    <text x="344" y="251" class="node-body">Optional S3 archive</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="606" y="166" width="226" height="116" rx="8" fill="#111827" stroke="#334155"/>
    <text x="634" y="202" class="node-title">Retrieval Workflow</text>
    <text x="634" y="229" class="node-body">Build grounded query</text>
    <text x="634" y="251" class="node-body">Return evidence chunks</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="906" y="166" width="236" height="116" rx="8" fill="#1f2937" stroke="#ff9900"/>
    <text x="934" y="202" class="node-title">Bedrock Knowledge Base</text>
    <text x="934" y="229" class="node-body">Managed retrieval</text>
    <text x="934" y="251" class="node-body">Source citations</text>
  </g>

  <path d="M258 224 H302" class="line"/>
  <path d="M536 224 H592" class="line"/>
  <path d="M832 224 H892" class="line"/>
  <path d="M906 265 C866 315 826 336 768 340" class="line"/>

  <g filter="url(#shadow)">
    <rect x="94" y="338" width="282" height="154" rx="10" fill="#0f172a" stroke="#334155"/>
    <text x="122" y="374" class="node-title">Supervisor Workflow</text>
    <text x="122" y="402" class="node-body">Coordinates retrieval, analysis,</text>
    <text x="122" y="424" class="node-body">validation, retries, and empty</text>
    <text x="122" y="446" class="node-body">retrieval escalation.</text>
    <rect x="122" y="464" width="162" height="22" rx="11" fill="#1e3a8a"/>
    <text x="203" y="480" text-anchor="middle" class="pill">typed contracts</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="438" y="330" width="178" height="82" rx="8" fill="#111827" stroke="#334155"/>
    <text x="466" y="364" class="node-title">Analysis Agent</text>
    <text x="466" y="390" class="node-body">Severity, category,</text>
    <text x="466" y="408" class="node-body">recommendations</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="668" y="330" width="188" height="82" rx="8" fill="#111827" stroke="#334155"/>
    <text x="696" y="364" class="node-title">Validation Agent</text>
    <text x="696" y="390" class="node-body">Unsupported claims,</text>
    <text x="696" y="408" class="node-body">confidence checks</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="438" y="454" width="188" height="82" rx="8" fill="#111827" stroke="#334155"/>
    <text x="466" y="488" class="node-title">Runtime Safety</text>
    <text x="466" y="514" class="node-body">Guardrails adapter</text>
    <text x="466" y="532" class="node-body">deterministic gates</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="684" y="454" width="190" height="82" rx="8" fill="#111827" stroke="#334155"/>
    <text x="712" y="488" class="node-title">Tool Executor</text>
    <text x="712" y="514" class="node-body">Escalation rules</text>
    <text x="712" y="532" class="node-body">citation mapping</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="934" y="486" width="208" height="92" rx="8" fill="#1f2937" stroke="#ff9900"/>
    <text x="962" y="522" class="node-title">CaseOutput JSON</text>
    <text x="962" y="549" class="node-body">Evidence-backed result</text>
    <text x="962" y="567" class="node-body">Optional S3 + CloudWatch</text>
  </g>

  <path d="M376 415 H424" class="line"/>
  <path d="M616 371 H654" class="line"/>
  <path d="M762 412 V440 C762 450 762 450 762 454" class="line"/>
  <path d="M626 495 H670" class="line"/>
  <path d="M874 495 C902 505 912 515 920 532" class="line"/>
  <path d="M235 338 V306 C235 292 250 282 302 274" class="muted-line"/>
  <path d="M376 445 C404 472 414 486 424 495" class="line"/>

  <g>
    <rect x="80" y="560" width="1040" height="44" rx="22" fill="#0b1220" stroke="#334155"/>
    <circle cx="112" cy="582" r="12" fill="url(#aws)"/>
    <text x="112" y="587" text-anchor="middle" class="small">AWS</text>
    <text x="144" y="587" class="caption">Bedrock Converse API, Knowledge Bases, S3, Lambda, CloudWatch, Pydantic schemas, offline evaluation, and GitHub Actions CI</text>
  </g>
</svg>
